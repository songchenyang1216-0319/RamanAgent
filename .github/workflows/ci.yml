name: CI

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ALLOW_ANONYMOUS_DEV: "true"
      AUTH_SECRET: "ci_auth_secret_value_for_tests_32_chars"
      VECTOR_DB_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      OCR_PROVIDER: none
      PDF_EXPORT_PROVIDER: none
      LLM_PLANNER_MODE: mock
      TOOL_CALLING_MODE: json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repository secret scan
        run: python scripts/check_repo_secrets.py
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Smoke checks
        shell: pwsh
        run: ./scripts/smoke_check.ps1
      - name: Pytest
        shell: pwsh
        run: python -m pytest -q
