services:
  ramanagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ramanagent:dev
    env_file:
      - .env
    environment:
      APP_ENV: development
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATABASE_URL: sqlite:////app/storage/agent_memory.db
      VECTOR_DB_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      OCR_PROVIDER: none
      PDF_EXPORT_PROVIDER: none
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
